# Local + CI infrastructure for Workeasy360.
#
# Ports are deliberately non-default so this stack can coexist with other
# projects on a developer machine.
#
# PgBouncer in transaction mode is present in local and CI for PARITY, not for
# performance: per 10-performance-concurrency.md §4 it is the highest-risk
# operational coupling in the design, so it must be exercised everywhere.

name: workeasy360

services:
  postgres:
    # PostgreSQL 16 plus the pgvector extension (Phase 8, ADR-031). The
    # pgvector image is the official postgres:16 Debian build with one extra
    # package, so the server and its on-disk format are unchanged; the
    # -trixie tag matches the Debian release (and glibc collations) the
    # previous postgres:16 image used, so existing text indexes stay valid.
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workeasy360
    command: >
      postgres
      -c log_statement=none
      -c max_connections=200
    ports:
      - "5442:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - w360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workeasy360"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6442:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: redis-server --save "" --appendonly no
    ports:
      - "6392:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: w360
      RABBITMQ_DEFAULT_PASS: w360_pw
    ports:
      - "5682:5672"
      - "15682:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  w360_pgdata:
