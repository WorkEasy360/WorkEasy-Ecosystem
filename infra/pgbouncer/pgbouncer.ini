;; PgBouncer in TRANSACTION pooling mode.
;;
;; This is the configuration risk R-01 is about: in transaction mode a server
;; connection returns to the pool at COMMIT, so a session-level
;; `SET app.organization_id` would be inherited by the next tenant's
;; transaction. The pool is deliberately tiny here so that server-connection
;; reuse is guaranteed during the leakage test rather than incidental.

[databases]
workeasy360 = host=postgres port=5432 dbname=workeasy360

;; Wildcard so per-run test databases (test_workeasy360, and pytest-xdist's
;; test_workeasy360_gw0 ...) are routed too. Without it the suite would fall
;; back to a direct connection and would stop exercising the pooler - which
;; is the one thing R-01 says must never be assumed.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 200
;; A deliberately tiny pool. With 24 concurrent clients sharing 2 server
;; connections, reuse is guaranteed rather than incidental - which is what
;; makes the R-01 leakage test meaningful instead of lucky.
default_pool_size = 2

;; min_pool_size = 0, not 2: pre-warmed connections are never released, so a
;; finished test run's database could never be dropped.
min_pool_size = 0
reserve_pool_size = 0

;; No reset query: DISCARD ALL would mask the very leak R-01 tests for, by
;; scrubbing session state PgBouncer is not supposed to be carrying anyway.
;; The safety of set_config(..., true) must come from PostgreSQL's transaction
;; semantics, not from a pooler cleanup step.
server_reset_query =
server_reset_query_always = 0

;; Release idle server connections quickly. Without this, pooled connections
;; to a finished run's test database keep it "in use" and the next run cannot
;; drop and recreate it.
server_idle_timeout = 10

ignore_startup_parameters = extra_float_digits,options,search_path

log_connections = 0
log_disconnections = 0
admin_users = w360_migrator
stats_users = w360_migrator
