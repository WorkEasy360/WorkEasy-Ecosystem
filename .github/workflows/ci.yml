name: CI

# Quality gates. A PR that fails one of these does not merge.
#
# The jobs are split so a failure names its own cause: "architecture" failing
# means a dependency rule was broken, not that a test is flaky. A single
# monolithic job would report only "CI failed".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  W360_ENVIRONMENT: ci
  W360_DB_NAME: workeasy360
  W360_DB_APP_USER: w360_app
  W360_DB_APP_PASSWORD: w360_app_pw
  W360_DB_MIGRATOR_USER: w360_migrator
  W360_DB_MIGRATOR_PASSWORD: w360_migrator_pw
  W360_DB_DIRECT_HOST: 127.0.0.1
  W360_DB_DIRECT_PORT: "5432"
  W360_DB_HOST: 127.0.0.1
  W360_DB_PORT: "6432"
  W360_REDIS_URL: redis://127.0.0.1:6379/0
  W360_BROKER_URL: amqp://w360:w360_pw@127.0.0.1:5672//

jobs:
  # --- fast feedback: no services needed ---------------------------------

  format-and-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check backend
      - name: Ruff (format)
        run: ruff format --check backend

  typing:
    name: Typing (contracts/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Typing is adopted incrementally. contracts/ is strict because it is
      # the layer every other module depends on, and a wrong type there
      # propagates everywhere.
      - run: mypy

  architecture:
    name: Architecture dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # The console script, not `python -m importlinter.cli`: the module form
      # exits 0 silently when it cannot resolve the root package, which would
      # make this gate pass while checking nothing.
      - name: Import contracts (F-1 ... F-8)
        run: lint-imports
        env:
          PYTHONPATH: backend

  # --- security scanning --------------------------------------------------

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still
          # exposed, and detection is treated as exposure.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Pinned: .secrets.baseline records the version and plugin set it was
      # generated with, and is compared against a scan by the same version.
      - run: pip install detect-secrets==1.5.0
      - name: Scan working tree
        # The full scan still runs; it is compared against .secrets.baseline,
        # whose every finding was audited and marked a false positive
        # (is_secret: false). Re-scanning with --baseline keeps those labels
        # and adds anything new unlabelled, so only a NEW finding (or one
        # audited as real) fails the build. To accept a reviewed false
        # positive, re-run this scan locally on a Linux checkout, then
        # `detect-secrets audit .secrets.baseline`, and commit the baseline.
        run: |
          detect-secrets scan --all-files \
            --exclude-files '\.venv/.*' \
            --exclude-files 'package-lock\.json' \
            --baseline .secrets.baseline
          python - <<'PY'
          import json, sys
          with open(".secrets.baseline") as fh:
              report = json.load(fh)
          findings = [
              (path, item)
              for path, items in report.get("results", {}).items()
              for item in items
              if item.get("is_secret") is not False
          ]
          if findings:
              for path, item in findings:
                  print(f"{path}:{item.get('line_number')} {item.get('type')}")
              sys.exit(
                  "Potential secrets not in the audited baseline. Rotate anything real."
              )
          print("No new secrets detected.")
          PY
      - name: gitleaks (history and working tree)
        # Phase 12. The allowlist in .gitleaks.toml is triaged entry by entry
        # (docs/phase-12/11-security-scans.md); a new finding fails the build.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0             git /repo --config /repo/.gitleaks.toml --redact --no-banner
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0             dir /repo --config /repo/.gitleaks.toml --redact --no-banner

      - name: Assert no environment files are tracked
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.(?!example)' ; then
            echo "A .env file is tracked in Git."
            exit 1
          fi
          echo "No environment files tracked."

  sast:
    name: Static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Bandit
        run: bandit -c pyproject.toml -r backend/workeasy360 backend/config -ll

  dependency-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict

  # --- the platform frontend ---------------------------------------------
  #
  # Phase 4 added an entire Next.js application and no CI job to check it,
  # so its lint, type, test and build gates existed only as commands a human
  # remembered to run. That is how a Content-Security-Policy that made the
  # production login page inert shipped with every test green: nothing in CI
  # ever produced a production build, and no unit test can see a CSP.

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS - the version the production image runs (Node 20 is
          # end of life; Phase 12).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `ci`, not `install`: the lockfile is the dependency decision, and a
      # build that silently resolves something else is not the build that was
      # reviewed.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=moderate
      # The build's own output is a gate. A nonce-based CSP requires every
      # route to be dynamically rendered (frontend/src/app/layout.tsx); a
      # route that slips back into static prerendering ships script tags with
      # no nonce, and 'strict-dynamic' then blocks every one of them.
      - name: No route is statically prerendered
        run: node scripts/assert-dynamic-rendering.mjs

  # --- the full suite, against real infrastructure -----------------------

  tests:
    name: Tests (PostgreSQL + PgBouncer + Redis + broker)
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 16 with pgvector (ADR-031); init.sql creates the
        # extension as the superuser before any migration runs.
        image: pgvector/pgvector:pg16-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workeasy360
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13
        env:
          RABBITMQ_DEFAULT_USER: w360
          RABBITMQ_DEFAULT_PASS: w360_pw
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Create database roles
        # Two roles, neither able to bypass RLS. CI must run as the non-owner
        # application role or every isolation test would pass without proving
        # anything (13-deployment-evolution.md section 2.2).
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
        env:
          PSQL_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PGPASSWORD: postgres

      - name: Start PgBouncer in transaction mode
        # Parity, not performance. R-01 is the highest-risk operational
        # coupling in the design, so CI exercises the real pooler rather than
        # connecting directly and discovering pooling problems in production.
        run: |
          # docker-compose reaches PostgreSQL by its service name; on the CI
          # host network it is loopback. Everything else about the config -
          # transaction mode, the tiny pool, no reset query - is shared, so
          # CI and local exercise the same pooler behaviour.
          mkdir -p /tmp/pgbouncer
          sed 's/host=postgres/host=127.0.0.1/' \
            infra/pgbouncer/pgbouncer.ini > /tmp/pgbouncer/pgbouncer.ini
          cp infra/pgbouncer/userlist.txt /tmp/pgbouncer/userlist.txt
          grep -q 'host=127.0.0.1' /tmp/pgbouncer/pgbouncer.ini \
            || { echo "host rewrite failed"; exit 1; }

          docker run -d --name pgbouncer --network host \
            -v /tmp/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro \
            -v /tmp/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro \
            edoburu/pgbouncer:v1.23.1-p2

          for _ in $(seq 1 30); do
            nc -z 127.0.0.1 6432 && break
            sleep 1
          done
          nc -z 127.0.0.1 6432 || { docker logs pgbouncer; exit 1; }

          # Prove traffic actually reaches PostgreSQL through the pooler.
          # Without this the suite could silently fall back to a direct
          # connection and stop testing what R-01 is about.
          PGPASSWORD=w360_app_pw psql \
            "postgresql://w360_app@127.0.0.1:6432/workeasy360" \
            -v ON_ERROR_STOP=1 -c "SELECT 1" \
            || { docker logs pgbouncer; exit 1; }

      - name: Migration checks
        run: |
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.migration

      - name: System checks (W360.E001 - E009)
        # No `--deploy`. Django's deployment checks assert production
        # facts - DEBUG off, secure cookies, HSTS - against whatever
        # settings module is loaded, and CI necessarily loads the
        # development one (W360_ENVIRONMENT=ci). With `--fail-level
        # WARNING` the step therefore failed on every run, which made it a
        # gate that could never go green and so enforced nothing.
        #
        # The deployment checks themselves are not dropped: they are
        # asserted against the *real* production settings module, with a
        # complete synthetic production environment, by
        # `test_production_accepts_a_valid_configuration` and
        # `test_production_refuses_insecure_configuration` in
        # backend/tests/security/test_security_baseline.py - which is a
        # stronger check than this step ever was, because it also proves
        # each insecure value is *refused* rather than merely warned about.
        run: python backend/manage.py check --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.migration

      - name: Deploy checks as the runtime role (RLS, ownership, timeouts)
        # Phase 12. The W360 deploy checks connect as the application role
        # through PgBouncer and fail the build on any W360.E* error: RLS or
        # FORCE missing on a tenant table, a role that can bypass RLS or owns
        # a table, or a connection without its statement/lock/idle timeouts.
        # (Django's own transport warnings are expected under development
        # settings, hence --fail-level ERROR.)
        run: python backend/manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development

      - name: Full test suite
        run: pytest -q --cov=backend/workeasy360 --cov-report=term-missing

      - name: Verification spikes
        # The three Sprint 0 spikes run in CI so a regression in RLS
        # isolation, broker semantics or entitlement latency is caught rather
        # than rediscovered.
        run: |
          python backend/tests/spikes/spike_r01_rls_pgbouncer.py
          python backend/tests/spikes/spike_r09_broker.py
          python backend/tests/spikes/spike_r14_entitlement_latency.py
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          W360_LOG_LEVEL: ERROR

      - name: Upload spike results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-results
          path: backend/tests/spikes/*.json
          if-no-files-found: ignore

  # --- the images that production runs (Phase 12) -----------------------

  images:
    name: Images (build + vulnerability and secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -f deploy/docker/backend.Dockerfile --build-arg RELEASE=${{ github.sha }} -t w360-backend:ci .
          docker build -f deploy/docker/frontend.Dockerfile --build-arg RELEASE=${{ github.sha }}             --build-arg BACKEND_ORIGIN=http://api:8000 -t w360-frontend:ci .
      - name: Trivy (HIGH/CRITICAL fail the build)
        run: |
          for image in w360-backend:ci w360-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0               image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Caddyfile and alert rules are valid
        run: |
          docker run --rm -e W360_CANONICAL_HOST=app.example.net -e W360_TLS_ISSUER=internal             -v "$PWD/deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2             caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/w:ro"             prom/prometheus:v3.5.0 check rules /w/alerts.yml

  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - format-and-lint
      - typing
      - architecture
      - secret-scan
      - sast
      - dependency-audit
      - frontend
      - tests
      - images
    steps:
      - run: echo "All quality gates passed."
