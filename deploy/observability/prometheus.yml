# Workeasy360 - Prometheus scrape configuration (Phase 12).
#
# Targets, all on the internal network:
#   api    /healthz/metrics  gauges from authoritative state (bearer token)
#   edge   :9180/metrics     request rate, latency and status by host (Caddy)
# Infrastructure exporters are standard and optional on a managed platform
# (RDS, ElastiCache, AmazonMQ publish their own); where self-hosted, add
# postgres_exporter, redis_exporter, node_exporter and blackbox_exporter jobs.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: w360-api
    metrics_path: /healthz/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: w360-edge
    static_configs:
      - targets: ["edge:9180"]
