;; Workeasy360 - production PgBouncer (Phase 12).
;;
;; Transaction pooling, as in local and CI (R-01): the tenant is bound with
;; set_config(..., true) per transaction, so a server connection carries no
;; tenant between transactions. Unlike infra/pgbouncer/pgbouncer.ini (a pool of
;; 2 to force reuse in tests), this pool is sized for traffic:
;;
;;   api containers x (gunicorn workers x threads) + Celery concurrency
;;   = 3 x 4 + (4 + 4 + 2) = 22 concurrent transactions per host, well inside
;;   default_pool_size, and default_pool_size + reserve stays far below
;;   PostgreSQL's max_connections (200) with room for the migrator and ops.
;;
;; `options` is ignored (dropped) - so the runtime role carries its own
;; statement/lock/idle timeouts (deploy/postgres/roles.sh, G-02).

[databases]
workeasy360 = host=postgres port=5432 dbname=workeasy360

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 500
default_pool_size = 40
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 80

server_reset_query =
server_reset_query_always = 0
server_idle_timeout = 60
server_connect_timeout = 5
; After a failed server login (PostgreSQL restarting) PgBouncer refuses every
; client until this passes. The default 15 s kept the platform down that long
; after the database was already back (Phase 12 resilience run); 2 s retries
; quickly without hammering a database that is still starting.
server_login_retry = 2
query_wait_timeout = 30
client_login_timeout = 15

ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
