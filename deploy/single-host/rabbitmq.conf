# Workeasy360 - RabbitMQ on the single small host (compose.single-host.yml).
#
# The node sizes its memory alarm from the memory it believes it has; on a
# 1 GiB host with a 256 MiB container ceiling, state that ceiling so the alarm
# (which blocks publishers) fires inside it rather than never or at once.
total_memory_available_override_value = 256MB
vm_memory_high_watermark.relative = 0.7
